name: Build Intel Mac App (macOS 14 Sonoma Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Build for Intel (x86_64)
        run: |
          SDK_VER=$(xcrun --sdk macosx --show-sdk-version)
          xcodebuild -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64" \
            VALID_ARCHS="x86_64 arm64" \
            EXCLUDED_ARCHS="" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$SDK_VER" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -disable-availability-checking' \
            OTHER_LDFLAGS='$(inherited) -Wl,-weak-lswiftSynchronization' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Patch Binary for macOS 14.0 & Weak-Link Swift 6 Libraries
        run: |
          TARGET_OS="14.0"
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          BIN_NAME=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleExecutable)
          BIN_PATH="$APP_PATH/Contents/MacOS/$BIN_NAME"
          SDK_VER=$(xcrun --sdk macosx --show-sdk-version)

          # 1. 將 Mach-O 最低版本設為 14.0
          vtool -set-build-version macos "$TARGET_OS" "$SDK_VER" -replace -output "$BIN_PATH" "$BIN_PATH"

          # 2. 將 libswiftSynchronization 等新版動態庫轉為 LC_LOAD_WEAK_DYLIB
          python3 -c '
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as f: data = bytearray(f.read())
          ncmds = struct.unpack("<I", data[16:20])[0]
          offset = 32
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack("<II", data[offset:offset+8])
              if cmd == 0x0c:
                  str_off = struct.unpack("<I", data[offset+8:offset+12])[0]
                  end = data.find(b"\x00", offset + str_off)
                  name = data[offset+str_off:end].decode("utf-8", "ignore")
                  if "Synchronization" in name:
                      struct.pack_into("<I", data, offset, 0x80000018)
              offset += cmdsize
          with open(path, "wb") as f: f.write(data)
          ' "$BIN_PATH"

          # 3. 更新 Info.plist 並簽名封裝
          plutil -replace LSMinimumSystemVersion -string "$TARGET_OS" "$APP_PATH/Contents/Info.plist"
          chmod +x "$APP_PATH/Contents/MacOS/"*
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Compositor-Ready.zip

      - name: Upload Compiled App
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Intel-Package
          path: Compositor-Ready.zip
