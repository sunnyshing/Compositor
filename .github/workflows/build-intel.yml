name: Build Intel Mac App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Build Compatibility Shim for macOS 14
        run: |
          cat << 'EOF' > shim.m
          #import <AppKit/AppKit.h>
          __attribute__((visibility("default")))
          id $sSo8NSCursorC6AppKitE11frameResize8position10directionsABSo0a5FrameE8PositionV_AbCE0hE9DirectionO3SetVtFZ(long pos, long dirs) {
              return [NSCursor crosshairCursor];
          }
          EOF
          clang -dynamiclib -arch x86_64 -mmacosx-version-min=14.0 -framework AppKit \
            -Wl,-install_name,@executable_path/libCompatShim.dylib \
            shim.m -o libCompatShim.dylib

      - name: Build for Intel (x86_64)
        run: |
          SDK_VER=$(xcrun --sdk macosx --show-sdk-version)
          SHIM_PATH="$(pwd)/libCompatShim.dylib"
          xcodebuild -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64" \
            VALID_ARCHS="x86_64 arm64" \
            EXCLUDED_ARCHS="" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$SDK_VER" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -disable-availability-checking' \
            OTHER_LDFLAGS="\$(inherited) \"$SHIM_PATH\" -Wl,-weak-lswiftSynchronization" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App for macOS 14.0
        run: |
          TARGET_OS="14.0"
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          BIN_NAME=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleExecutable)
          BIN_PATH="$APP_PATH/Contents/MacOS/$BIN_NAME"
          SDK_VER=$(xcrun --sdk macosx --show-sdk-version)

          # 1. 複製補丁動態庫到 App 內部
          cp libCompatShim.dylib "$APP_PATH/Contents/MacOS/"

          # 2. 將 Mach-O 最低版本設為 14.0
          vtool -set-build-version macos "$TARGET_OS" "$SDK_VER" -replace -output "$BIN_PATH" "$BIN_PATH"

          # 3. 更新 Info.plist 並簽名封裝
          plutil -replace LSMinimumSystemVersion -string "$TARGET_OS" "$APP_PATH/Contents/Info.plist"
          chmod +x "$APP_PATH/Contents/MacOS/"*
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Compositor-Ready.zip

      - name: Upload Compiled App
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Intel-Package
          path: Compositor-Ready.zip
